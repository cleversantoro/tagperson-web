@if (store.selected(); as sheet) {
  <div class="page-header">
    <app-character-header [sheet]="sheet" />
    <button
      mat-flat-button
      type="button"
      [disabled]="exporting()"
      (click)="exportPdf(sheet.id)"
    >
      <mat-icon>picture_as_pdf</mat-icon>
      {{ exporting() ? 'Gerando PDF...' : 'Exportar PDF' }}
    </button>
  </div>

  @if (exportError()) {
    <p class="export-error" role="alert">{{ exportError() }}</p>
  }

  <div class="grid">
    <section class="main">
      <mat-tab-group>
        <mat-tab label="Atributos"><app-tab-attributes [sheet]="sheet" /></mat-tab>
        <mat-tab label="Habilidades"><app-tab-skills [sheet]="sheet" /></mat-tab>
        <mat-tab label="Combate"><app-tab-combat [sheet]="sheet" /></mat-tab>
        <mat-tab label="Arma"><app-tab-weapon [sheet]="sheet" /></mat-tab>
        <mat-tab label="Magias" [disabled]="!canAccessSpellsTab(sheet.profissao)"><app-tab-spells [sheet]="sheet" /></mat-tab>
        <mat-tab label="Caracterização"><app-tab-characterization [sheet]="sheet" /></mat-tab>
        <mat-tab label="Caracteristicas"><app-tab-traits [sheet]="sheet" /></mat-tab>
      </mat-tab-group>
    </section>
  </div>
} @else {
  <p>Nenhum personagem selecionado.</p>
}
