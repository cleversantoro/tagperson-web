<div class="wrap">
  <div class="left">
    <mat-card>
      <mat-card-title>Caracterização</mat-card-title>
      <mat-card-content>
        <div class="selectors">
          <button
            mat-raised-button
            color="primary"
            type="button"
            (click)="openCharacterizationModal()"
            [disabled]="isSavingCharacterization() || isLoadingCharacterizations()">
            Nova Caracterização
          </button>
        </div>

        @if (isLoadingCharacterizations()) {
          <div style="text-align: center; padding: 16px;">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        }

        <mat-card>
          <mat-card-title>Caracterizações Cadastradas</mat-card-title>
          <mat-card-content>
            <div class="table-container">
              <table mat-table [dataSource]="sheet.caracterizacoes" class="caracterizacoes-table">
                <!-- Nome Column -->
                <ng-container matColumnDef="nome">
                  <th mat-header-cell *matHeaderCellDef>Nome</th>
                  <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
                </ng-container>

                <!-- Nivel Column -->
                <ng-container matColumnDef="nivel">
                  <th mat-header-cell *matHeaderCellDef>Nível</th>
                  <td mat-cell *matCellDef="let element">{{ element.nivel ?? '-' }}</td>
                </ng-container>

                <!-- Info Column -->
                <ng-container matColumnDef="info">
                  <th mat-header-cell *matHeaderCellDef>Info</th>
                  <td mat-cell *matCellDef="let element">
                    <button
                      mat-icon-button
                      type="button"
                      (click)="openDetailsModal(element)"
                      matTooltip="Ver detalhes"
                    >
                      <mat-icon>help_outline</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- No data row -->
                @if (sheet.caracterizacoes.length === 0) {
                  <tr class="mat-row">
                    <td class="mat-cell muted" [attr.colspan]="displayedColumns.length">
                      Nenhuma caracterização cadastrada.
                    </td>
                  </tr>
                }
              </table>
            </div>
          </mat-card-content>
        </mat-card>
      </mat-card-content>
    </mat-card>
  </div>
</div>
