<div class="wrap">
  <mat-form-field appearance="outline" class="search">
    <mat-label>Buscar</mat-label>
    <input matInput (input)="q.set(($any($event.target)).value)" />
  </mat-form-field>

  <button mat-raised-button color="primary" class="add" (click)="create()">
    <mat-icon>add</mat-icon> Novo
  </button>

  <mat-nav-list>
    <table class="tbl">
      <thead>
        <tr>
          <th></th>
          <th>Nome</th>
          <th>Nível</th>
        </tr>
      </thead>
      <tbody>
        @for (c of filtered(); track c.id) {
          <tr (click)="store.select(c.id)" [class.active]="store.selectedId() === c.id" style="cursor: pointer">
            <td [title]="c.profissao"><img [src]="'assets/profissao/' + c.profissao.trim().toLowerCase() + '.png'" height="24" width="24" [alt]="c.profissao"></td>
            <td>{{c.nome}}</td>
            <td>{{c.nivel}}</td>
          </tr>
        }
      </tbody>
    </table>
  </mat-nav-list>
</div>
