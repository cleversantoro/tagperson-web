<div class="wrap">
  <mat-card class="points">
    <mat-card-title>
      PONTOS: {{ sheet.orcamento?.attributes?.used ?? sheet.atributos.pointsUsed }} /
      {{ sheet.orcamento?.attributes?.granted ?? sheet.atributos.pointsTotal }}
    </mat-card-title>
  </mat-card>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }

  <div class="content">
    <div class="attrs">
      @for (k of keys; track k) {
        <mat-card class="attr">
          <mat-card-title>{{labels[k]}}</mat-card-title>
          <div class="val">{{value(k)}}</div>

          <mat-slider min="-4" max="6" step="1" discrete>
            <input matSliderThumb [value]="value(k)" (valueChange)="set(k, $event)">
          </mat-slider>

          <div class="range">-4 valor +6</div>
        </mat-card>
      }
    </div>

    <app-attributes-card [sheet]="sheet" />
  </div>
</div>
