<div class="wrap">
  @if (isLoadingCharacterizations()) {
  <div style="text-align: center; padding: 16px;">
    <mat-spinner diameter="30"></mat-spinner>
  </div>
  }

  <div class="left">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Caracterizações</mat-card-title>
        <button type="button" (click)="openCharacterizationModal()"
          [disabled]="isSavingCharacterization() || isLoadingCharacterizations()" class="add-btn">
          Nova Caracterização
        </button>
      </mat-card-header>

      <mat-card-content>
        <div class="table-container">
          <table mat-table [dataSource]="sheet.caracterizacoes" class="caracterizacoes-table">
            <!-- Nome Column -->
            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
            </ng-container>

            <!-- Nivel Column -->
            <ng-container matColumnDef="nivel">
              <th mat-header-cell *matHeaderCellDef>Nível</th>
              <td mat-cell *matCellDef="let element">{{ element.nivel ?? '-' }}</td>
            </ng-container>

            <!-- Ações Column -->
            <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button type="button" (click)="deleteCharacterization(element.id)" matTooltip="Deletar caracterização">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
              (click)="selectCharacterization(row)"
              [class.selected]="selected()?.id === row.id"></tr>

            <!-- No data row -->
            @if (sheet.caracterizacoes.length === 0) {
            <tr class="mat-row">
              <td class="mat-cell muted" [attr.colspan]="displayedColumns.length">
                Nenhuma caracterização cadastrada.
              </td>
            </tr>
            }
          </table>
        </div>
      </mat-card-content>

    </mat-card>
  </div>

  <div class="right">
    <mat-card>
      <mat-card-title>Detalhes</mat-card-title>

      <mat-card-content class="details">

        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput [value]="selected()?.nome ?? ''" readonly />
        </mat-form-field>

        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>Tipo</mat-label>
            <input matInput [value]="selected()?.nomeTipo ?? ''" readonly />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Grupo</mat-label>
            <input matInput [value]="selected()?.nomeGrupo ?? ''" readonly />
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Nível</mat-label>
          <input matInput [value]="selected()?.nivel ?? '-'" readonly />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descrição</mat-label>
          <textarea matInput rows="8" [value]="selected()?.descricao ?? ''" readonly></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Notas</mat-label>
          <textarea matInput rows="4" [value]="selected()?.obs ?? ''" readonly></textarea>
        </mat-form-field>

      </mat-card-content>
    </mat-card>
  </div>

</div>
