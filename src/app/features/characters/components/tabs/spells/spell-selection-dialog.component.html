<!-- <h2 mat-dialog-title>Adicionar Magia da Profissão</h2> -->
<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <div class="modal-form">
    <!-- Magia -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Magia</mat-label>
      <mat-select [value]="selectedSpellId() ?? ''" (selectionChange)="selectedSpellId.set($any($event.value) ? +$any($event.value) : null)">
        <mat-option [value]="null">Selecione...</mat-option>
        @for (spell of availableSpells(); track spell.id) {
        <mat-option [value]="spell.id">
          {{spell.name}}
          @if (spell.cost) {
          • Custo: {{spell.cost}}
          }
        </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Nível -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nível</mat-label>
      <input matInput type="number" min="0" [value]="spellLevel()" (input)="spellLevel.set(+$any($event.target).value)" />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="confirm()" [disabled]="!selectedSpellId()">Adicionar</button>
</mat-dialog-actions>
